name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e .[dev]

      - name: Run tests
        run: |
          pytest -q

  # Editable installs (-e) never exercise wheel packaging, so a broken wheel
  # can pass tests and still fail every real `pip install` from source.
  # This job builds the actual wheel and installs it into a clean venv.
  wheel-gate:
    name: wheel-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip build

      - name: Build distribution
        run: |
          python -m build

      - name: Verify wheel archive contents
        run: |
          python - <<'PY'
          import collections
          import glob
          import sys
          import zipfile

          wheels = sorted(glob.glob("dist/*.whl"))
          if len(wheels) != 1:
              sys.exit(f"expected exactly one wheel in dist/, found {len(wheels)}")

          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()

              duplicates = [
                  name
                  for name, count in collections.Counter(names).items()
                  if count > 1
              ]
              if duplicates:
                  sys.exit(f"wheel contains duplicate archive entries: {sorted(duplicates)}")

              skill_doc = "agent_reach/skill/SKILL.md"
              if skill_doc not in names:
                  sys.exit(f"wheel is missing the skill instructions at {skill_doc}")

              categories = {
                  "guides": "agent_reach/guides/",
                  "helper scripts": "agent_reach/scripts/",
                  "skill references": "agent_reach/skill/references/",
              }
              for label, prefix in categories.items():
                  entries = [
                      name
                      for name in names
                      if name.startswith(prefix) and not name.endswith("/")
                  ]
                  if not entries:
                      sys.exit(f"wheel is missing {label} entries under {prefix}")
                  print(f"{label}: {len(entries)} entries")

          print(f"wheel archive checks passed: {wheels[0]}")
          PY

      - name: Create clean virtual environment and install wheel
        run: |
          python -m venv "$RUNNER_TEMP/agent-reach-wheel-venv"
          "$RUNNER_TEMP/agent-reach-wheel-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/agent-reach-wheel-venv/bin/python" -m pip install dist/*.whl

      - name: Query installed CLI version
        run: |
          "$RUNNER_TEMP/agent-reach-wheel-venv/bin/agent-reach" version

      - name: Verify skill resource from outside the repository
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/agent-reach-wheel-venv/bin/python" - <<'PY'
          import importlib.resources

          import agent_reach

          skill_doc = (
              importlib.resources.files("agent_reach")
              .joinpath("skill")
              .joinpath("SKILL.md")
          )
          if not skill_doc.is_file():
              raise SystemExit("agent_reach/skill/SKILL.md is not installed as a file")

          content = skill_doc.read_text(encoding="utf-8")
          if not content.strip():
              raise SystemExit("agent_reach/skill/SKILL.md is empty")

          print(
              f"Agent Reach {agent_reach.__version__}: "
              f"SKILL.md resource is a file ({len(content)} bytes)"
          )
          PY
